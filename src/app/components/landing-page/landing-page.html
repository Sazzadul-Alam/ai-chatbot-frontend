<div class="auth-modal-overlay shell">
  <div class="auth-modal">
    <div class="auth-modal-header">
      <div class="auth-logo">
        <img src="assets/images/isage-logo.svg" alt="iSAGE 2.0" />
      </div>
      <h2>Welcome to iSAGE 2.0</h2>
      <p>Choose how you'd like to continue</p>
    </div>

    <div class="auth-modal-body">
      <button class="auth-btn signin-btn" (click)="onSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign In
      </button>

      <button class="auth-btn signup-btn" (click)="onSignUp()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        Sign Up
      </button>

      <button class="auth-btn guest-btn" (click)="onGuest()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Continue as Guest
      </button>
    </div>

    <div class="auth-modal-footer">
      <p class="legal-note">By continuing, you agree to our Terms of Service and Privacy Policy.</p>
    </div>
  </div>
</div>
