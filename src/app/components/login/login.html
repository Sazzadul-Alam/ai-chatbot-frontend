<div class="auth-modal-overlay">
  <div class="auth-modal">

    <h2 class="modal-title">Log in to your account</h2>
    <p class="modal-subtitle">Enter details to log in to your account.</p>

    <!-- Error banner -->
    <div class="error-banner" *ngIf="errorMessage">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ errorMessage }}
    </div>

    <!-- Username -->
    <div class="field-group">
      <label class="field-label">Email</label>
      <div class="input-wrap">
        <input
          class="field-input"
          type="text"
          placeholder="Write Your Email"
          [(ngModel)]="userName"
          name="userName"
          autocomplete="username"
        />
      </div>
    </div>

    <!-- Password -->
    <div class="field-group">
      <div class="label-row">
        <label class="field-label">Password</label>
        <a class="forgot-link" (click)="onForgotPassword()">Forgot Password?</a>
      </div>
      <div class="input-wrap input-wrap--icon">
        <input
          class="field-input"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Write Your Password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
        />
        <button type="button" class="eye-btn" (click)="showPassword = !showPassword" tabindex="-1">
          <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Real Google reCAPTCHA v2 (site key + dark theme provided via RECAPTCHA_SETTINGS) -->
    <div class="captcha-row">
      <re-captcha
        (resolved)="onCaptchaResolved($event)"
        (errored)="onCaptchaResolved(null)"
        errorMode="handled">
      </re-captcha>
    </div>

    <!-- Login button -->
    <button
      class="btn-login"
      (click)="onLogin()"
      [disabled]="!captchaVerified || isLoading">
      <span *ngIf="!isLoading">Log In</span>
      <span *ngIf="isLoading" class="spinner-wrap">
        <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        Logging in…
      </span>
    </button>

    <p class="signup-text">
      Don't have an account? <span (click)="onSignUp()">Sign Up</span>
    </p>
    <p class="signup-text">
      OR <span (click)="asGuest()">Login As Guest</span>
    </p>

  </div>
</div>
